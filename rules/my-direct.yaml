# 个人直连清单（rule-provider，behavior: domain）
#
# 收录原则（只放两类，V61 已有的不重复写）：
#   1) 路由纠正：V61 会把它们送进代理组，但这里需要直连；
#   2) 规则缺口：V61 的 RULE-SET,cn（geosite:cn）、ChinaMax、内联规则都覆盖不到的域名。
# V61 已经覆盖且默认直连的域名（WPS、立创 EDA、校园网、B 站等）不再重复，
# 否则只会增加维护成本，并把这些域名从 V61 的广告/安全规则下"放行"。
#
# 语法（behavior: domain）：
#   +.example.com   含子域名（等价 DOMAIN-SUFFIX，最常用）
#   .example.com    仅子域名
#   example.com     仅精确匹配
#
# 生效方式：push 后 FlClash 按 provider interval（默认 24h）自动拉取；
# 想立刻生效：断开重连，或到「资源」页手动更新 provider。

payload:
  # ===== 1) 路由纠正：Steam 下载 / 国内 CDN =====
  # V61 把 RULE-SET,steam 整体送进「🕹️ 国外游戏」（默认代理），这里改回直连；
  # 商店 / 社区 / 创意工坊不受影响，仍由 V61 的规则组决定。
  - "+.steamcontent.com"
  - "+.steamcontent.tnkjmec.com"
  - "+.steamserver.net"
  - "+.steamcdn-a.akamaihd.net"
  - "+.cm.steampowered.com"
  - "+.steamusercontent.com"
  - "+.steamchina.com"
  - "+.clngaa.com"
  - "+.ksyna.com"
  - "+.wmsj.cn"
  - "+.bscstorage.net"
  - "+.eccdnx.com"
  - "+.pinyuncloud.com"

  # ===== 2) V61 规则库未覆盖的国内域名 =====
  - "+.szuea.com"
  - "+.musiczh.top"
  - "+.keysking.com"
  - "+.neituiya.com"
  # 注意：baud-dance.com 疑似字节系统计/CDN 域，V61 广告层可能有意图拦截，
  # 若发现它影响了抖音/西瓜视频的正常播放再放开下面这行。
  # - "+.baud-dance.com"
