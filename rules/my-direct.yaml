# 个人直连清单（rule-provider，behavior: domain）
#
# 用法：这里只放「V61 的 RULE-SET,cn / GEOIP,CN 兜不住、但你必须直连」的站点。
# 改完保存 → 等 GitHub Action 不需要、FlClash 到点自动拉取（interval 24h）；
# 想立刻生效：FlClash 里断开重连 / 切换一次订阅，或到「资源」页手动更新该 provider。
#
# 语法：behavior: domain 的 provider 支持三种写法
#   +.example.com   包含子域名（等价 DOMAIN-SUFFIX，最常用）
#   .example.com    仅子域名
#   example.com     仅精确匹配
#
# 注意：这些规则会被前置到 V61 的广告拦截层之前，别把整段国内域名表搬进来。

payload:
