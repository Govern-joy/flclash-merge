name: build-merged-script

on:
  # 每天 03:17 (UTC) 自动跟随上游更新；想改时间改这里
  schedule:
    - cron: "17 3 * * *"
  # 也可以在 Actions 页面手动点运行
  workflow_dispatch:
  # 你改了自己的补丁/规则/构建脚本时自动重建
  push:
    branches: [main]
    paths:
      - "patch/**"
      - "rules/**"
      - "test/**"
      - "build.mjs"
      - "package.json"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: build-merged
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 防线：节点凭据不得进入仓库（历史教训见 README「安全模型」）
      - name: Secret scan
        run: |
          set -e
          UID_RE='[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'

          # 源码区：uuid / 节点 IP / 分享链接 / reality 配置
          SRC_PAT="$UID_RE|205\.186\.64\.117|(vless|vmess|trojan|hysteria2)://|reality-opts"
          if grep -rEn "$SRC_PAT" patch rules build.mjs 2>/dev/null; then
            echo "::error::源码区检测到疑似节点凭据；凭据应放在 Secret SELF_NODES_JSON 中。"
            exit 1
          fi

          # 产物区：只查 uuid 与节点 IP（上游代码会提到 reality-opts，不能当特征）
          if [ -d dist ]; then
            if grep -rEn "$UID_RE|205\.186\.64\.117" dist 2>/dev/null; then
              echo "::error::dist 产物中出现 uuid 或节点 IP；请勿提交带节点的构建结果。"
              exit 1
            fi
          fi

          echo "secret scan: clean"

      - name: Build merged script
        env:
          RULES_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/rules
          # 可选：在仓库 Settings → Variables 里设置 V61_URL 可临时钉住上游版本
          V61_URL: ${{ vars.V61_URL }}
        run: node build.mjs

      - name: Commit dist
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "上游没有变化，无需提交"
          else
            git commit -m "chore: rebuild merged script"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi

      # 仓库里的 dist 是通用版（不含节点）；带节点的版本只发到 secret gist
      - name: Build with self nodes
        env:
          RULES_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/rules
          V61_URL: ${{ vars.V61_URL }}
          SELF_NODES_JSON: ${{ secrets.SELF_NODES_JSON }}
        run: |
          if [ -z "$SELF_NODES_JSON" ]; then
            echo "未配置 SELF_NODES_JSON，跳过"
            exit 0
          fi
          node build.mjs

      - name: Publish to secret gist
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          SELF_NODES_JSON: ${{ secrets.SELF_NODES_JSON }}
        run: |
          if [ -z "$GIST_ID" ] || [ -z "$GH_TOKEN" ] || [ -z "$SELF_NODES_JSON" ]; then
            echo "未配置 GIST_ID / GIST_TOKEN / SELF_NODES_JSON，跳过发布"
            exit 0
          fi
          jq -n --rawfile c dist/merged.js '{files:{"merged.js":{content:$c}}}' > /tmp/gist.json
          gh api -X PATCH "gists/$GIST_ID" --input /tmp/gist.json > /dev/null
          echo "已发布到 gist $GIST_ID"
