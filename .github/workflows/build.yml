name: build-merged-script

on:
  # 每天 03:17 (UTC) 自动跟随上游更新；想改时间改这里
  schedule:
    - cron: "17 3 * * *"
  # 也可以在 Actions 页面手动点运行
  workflow_dispatch:
  # 你改了自己的补丁/规则/构建脚本时自动重建
  push:
    branches: [main]
    paths:
      - "patch/**"
      - "rules/**"
      - "test/**"
      - "build.mjs"
      - "package.json"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: build-merged
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build merged script
        env:
          RULES_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/rules
          # 可选：在仓库 Settings → Variables 里设置 V61_URL 可临时钉住上游版本
          V61_URL: ${{ vars.V61_URL }}
        run: node build.mjs

      - name: Commit dist
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "上游没有变化，无需提交"
          else
            git commit -m "chore: rebuild merged script"
            git push
          fi

      # 仓库里的 dist 是通用版（不含节点）；带节点的版本只发到 secret gist
      - name: Build with self nodes
        env:
          RULES_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/rules
          V61_URL: ${{ vars.V61_URL }}
          SELF_NODES_JSON: ${{ secrets.SELF_NODES_JSON }}
        run: |
          if [ -z "$SELF_NODES_JSON" ]; then
            echo "未配置 SELF_NODES_JSON，跳过"
            exit 0
          fi
          node build.mjs

      - name: Publish to secret gist
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          SELF_NODES_JSON: ${{ secrets.SELF_NODES_JSON }}
        run: |
          if [ -z "$GIST_ID" ] || [ -z "$GH_TOKEN" ] || [ -z "$SELF_NODES_JSON" ]; then
            echo "未配置 GIST_ID / GIST_TOKEN / SELF_NODES_JSON，跳过发布"
            exit 0
          fi
          jq -n --rawfile c dist/merged.js '{files:{"merged.js":{content:$c}}}' > /tmp/gist.json
          gh api -X PATCH "gists/$GIST_ID" --input /tmp/gist.json > /dev/null
          echo "已发布到 gist $GIST_ID"
